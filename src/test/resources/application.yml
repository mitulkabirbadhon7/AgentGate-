spring:
  application:
    name: agentgate-test
  datasource:
    url: jdbc:h2:mem:agentgate_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

agentgate:
  security:
    jwt:
      issuer: https://auth.agentgate.local
      audience: agentgate-core
      secret-key: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    admin:
      username: admin
      password: admin_test_password
