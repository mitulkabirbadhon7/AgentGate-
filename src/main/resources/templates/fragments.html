<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' — AgentGate Governance Gateway'">AgentGate</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Sidebar Fragment -->
<aside th:fragment="sidebar(activeNav)" class="sidebar">
    <div class="brand">
        <div class="brand-icon">AG</div>
        <div>
            <div class="brand-title">AgentGate</div>
            <div class="brand-subtitle">Zero-Trust AI Gateway</div>
        </div>
    </div>
    
    <ul class="nav-menu">
        <li class="nav-item">
            <a th:href="@{/}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home Showcase</span>
            </a>
        </li>
        <li class="nav-item" th:classappend="${activeNav == 'dashboard' ? 'active' : ''}">
            <a th:href="@{/dashboard}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
                <span>Dashboard</span>
            </a>
        </li>
        <li class="nav-item" th:classappend="${activeNav == 'agents' ? 'active' : ''}">
            <a th:href="@{/agents}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                <span>Agents</span>
            </a>
        </li>
        <li class="nav-item" th:classappend="${activeNav == 'tools' ? 'active' : ''}">
            <a th:href="@{/tools}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                <span>Tools & Servers</span>
            </a>
        </li>
        <li class="nav-item" th:classappend="${activeNav == 'policies' ? 'active' : ''}">
            <a th:href="@{/policies}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Policies & Playground</span>
            </a>
        </li>
        <li class="nav-item" th:classappend="${activeNav == 'approvals' ? 'active' : ''}">
            <a th:href="@{/approvals}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>
                <span>Approvals</span>
                <span th:if="${pendingApprovals != null && pendingApprovals > 0}" class="nav-badge" th:text="${pendingApprovals}">0</span>
            </a>
        </li>
        <li class="nav-item" th:classappend="${activeNav == 'audit' ? 'active' : ''}">
            <a th:href="@{/audit}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                <span>Audit Chain</span>
            </a>
        </li>
        <li class="nav-item" th:classappend="${activeNav == 'killswitches' ? 'active' : ''}">
            <a th:href="@{/killswitches}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
                <span>Kill Switches</span>
            </a>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div>AgentGate v1.0.0-SNAPSHOT</div>
        <div style="color: var(--text-muted); font-size: 0.7rem; margin-top: 4px;">SHA-256 Hash Chain · Zero-Trust</div>
    </div>
</aside>

<!-- Topbar Fragment -->
<header th:fragment="topbar(pageTitle)" class="topbar">
    <div style="display: flex; align-items: center; gap: 16px;">
        <h1 class="page-title" th:text="${pageTitle}">Dashboard</h1>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
        <div class="status-indicator">
            <span class="pulse-dot"></span>
            <span>GATEWAY SECURE</span>
        </div>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">← View Home Showcase</a>
    </div>
</header>

<!-- Interactive Spotlight Script -->
<script th:fragment="spotlightScript">
document.addEventListener('DOMContentLoaded', () => {
    const targets = document.querySelectorAll('.spotlight-interactive, .kpi-card, .panel');
    targets.forEach(card => {
        card.addEventListener('mousemove', e => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', x + 'px');
            card.style.setProperty('--mouse-y', y + 'px');
        });
    });
});
</script>

</body>
</html>
