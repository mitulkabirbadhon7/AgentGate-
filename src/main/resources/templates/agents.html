<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Agents Registry')}"></head>
<body>

<aside th:replace="~{fragments :: sidebar(${activeNav})}"></aside>

<div class="main-wrapper">
    <header th:replace="~{fragments :: topbar('Registered Agent Clients')}"></header>

    <main class="content-body">
        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">OAuth2 Agent Identifiers</div>
                <div class="panel-actions">
                    <span class="chip chip-indigo">Verified Client Credentials</span>
                </div>
            </div>
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Client ID</th>
                            <th>Display Name</th>
                            <th>Internal Name</th>
                            <th>Status</th>
                            <th>Authentication Mode</th>
                            <th>Created At</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="agent : ${agents}">
                            <td class="mono" style="color: #818cf8; font-weight: 600;" th:text="${agent.clientId != null ? agent.clientId : '—'}">agent-id</td>
                            <td th:text="${agent.displayName != null && !agent.displayName.isBlank() ? agent.displayName : (agent.name != null ? agent.name : '—')}">Display Name</td>
                            <td class="mono" th:text="${agent.name != null ? agent.name : '—'}">Name</td>
                            <td>
                                <span class="chip"
                                      th:classappend="${agent.status != null && agent.status.name() == 'ACTIVE' ? 'chip-emerald' : (agent.status != null && agent.status.name() == 'SUSPENDED' ? 'chip-amber' : 'chip-rose')}"
                                      th:text="${agent.status != null ? agent.status : 'ACTIVE'}">ACTIVE</span>
                            </td>
                            <td>
                                <span class="chip chip-emerald">HMAC-SHA256 JWT</span>
                            </td>
                            <td th:text="${agent.createdAt != null ? #temporals.format(agent.createdAt, 'yyyy-MM-dd HH:mm') : '—'}">2026-11-21 00:00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(agents)}">
                            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">
                                No agent clients registered yet.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

</body>
</html>
